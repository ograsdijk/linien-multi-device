name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch supersedes the first; there is no value in
# finishing a run for a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberately its own job, with no dependencies to install, so a stale
  # bundled daemon shows up as a distinctly named red check in seconds rather
  # than being buried in the test output. This is the guard for the bug where
  # BUNDLED_VERSION said 1.3.0 while the committed binary was still 1.2.0:
  # installing appeared to work, the board kept reporting the old version, and
  # the "update available" banner came back on every poll.
  bundled-daemon:
    name: bundled daemon binary is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 rp-telemetry/check_bundle_freshness.py

  gateway:
    name: gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        working-directory: linien-gateway
        # --frozen so a drifting uv.lock fails here rather than silently
        # resolving something different from what developers run.
        run: uv sync --frozen --group dev
      - name: Test
        working-directory: linien-gateway
        # test_rp_telemetry_daemon.py compiles the C daemon with the runner's
        # cc and runs it against a fake sysfs tree, so the protocol and the
        # XADC maths are exercised for real on Linux.
        run: uv run pytest -q

  web:
    name: web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linien-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: linien-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - name: Build
        # The build output is committed (the gateway serves dist/), so this
        # catches a source change that was never rebuilt.
        run: npm run build
